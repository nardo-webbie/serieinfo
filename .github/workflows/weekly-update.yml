name: Weekly Series & Film Update

on:
  schedule:
    - cron: "0 3 * * 0"   # Every Sunday at 03:00 UTC
  workflow_dispatch:       # Manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run weekly update
        env:
          TMDB_KEY:             ${{ secrets.TMDB_KEY }}
          GH_PAT:               ${{ secrets.GH_PAT }}
          GH_GIST_ID:       ${{ secrets.GH_GIST_ID }}
          GH_FILMS_GIST_ID: ${{ secrets.GH_FILMS_GIST_ID }}
        run: node scripts/weekly-update.mjs
